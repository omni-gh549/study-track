name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit + UI tests on the iPhone simulator
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          runtimes = sorted(k for k in devices if 'iOS' in k)
          for key in reversed(runtimes):
              for d in devices[key]:
                  if d['name'].startswith('iPhone'):
                      print(d['udid']); sys.exit(0)
          sys.exit(1)")
          echo "Using simulator $UDID"
          mkdir -p screenshots
          TEST_RUNNER_SCREENSHOT_DIR="$PWD/screenshots" xcodebuild test \
            -project StudyTrack.xcodeproj \
            -scheme StudyTrack \
            -destination "platform=iOS Simulator,id=$UDID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | tail -n 15

      - name: Show test failures
        if: failure()
        run: |
          grep -nE "error:|: failed|failed \(|XCTAssert|Fatal|Crash" test.log | head -120 || true
          xcrun xcresulttool get test-results summary --path TestResults.xcresult 2>/dev/null | head -150 || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            test.log

      - name: Build (unsigned, device SDK)
        run: |
          set -o pipefail
          xcodebuild \
            -project StudyTrack.xcodeproj \
            -scheme StudyTrack \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build | tee build.log | tail -n 40

      - name: Package IPAs (full + lite)
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          # Full edition: includes the Live Activity extension.
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../StudyTrack.ipa Payload)
          # Lite edition: same app without app extensions, for LiveContainer (which can't run them).
          mkdir -p ipa-lite/Payload
          cp -R "$APP" ipa-lite/Payload/
          rm -rf ipa-lite/Payload/*.app/PlugIns
          (cd ipa-lite && zip -qry ../StudyTrack-lite.ipa Payload)
          ls -lh StudyTrack.ipa StudyTrack-lite.ipa
          # Guard rails: the full IPA must contain the extension, the lite one must not.
          unzip -l StudyTrack.ipa | grep -q "\.appex/Info.plist"
          if unzip -l StudyTrack-lite.ipa | grep -q "\.appex/"; then echo "lite IPA still has an extension"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: StudyTrack-ipa
          path: |
            StudyTrack.ipa
            StudyTrack-lite.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 MARKETING_VERSION project.yml | sed 's/.*"\(.*\)".*/\1/')
          TAG="v${VERSION}-build.${{ github.run_number }}"
          # Release notes = the commit message (minus trailers); the app shows them in "App updates".
          git log -1 --pretty=%B | grep -vE '^(Co-Authored-By|Claude-Session):' > notes.txt || true
          printf '\n---\nUnsigned IPAs built from %s. StudyTrack.ipa = full (with Live Activity). StudyTrack-lite.ipa = no app extensions (use this one in LiveContainer).\n' "${{ github.sha }}" >> notes.txt
          gh release create "$TAG" StudyTrack.ipa StudyTrack-lite.ipa \
            --target "${{ github.sha }}" \
            --title "StudyTrack ${VERSION} (build ${{ github.run_number }})" \
            --notes-file notes.txt \
            --prerelease
