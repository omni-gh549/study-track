name: StudyTrack
options:
  bundleIdPrefix: com.studytrack
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.6.2"
    CURRENT_PROJECT_VERSION: "1"
targets:
  StudyTrack:
    type: application
    platform: iOS
    sources:
      - StudyTrack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studytrack.app
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: StudyTrack
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
  StudyTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StudyTrackTests
    dependencies:
      - target: StudyTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.studytrack.app.tests
  StudyTrackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - StudyTrackUITests
    dependencies:
      - target: StudyTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.studytrack.app.uitests
schemes:
  StudyTrack:
    build:
      targets:
        StudyTrack: all
    test:
      targets:
        - StudyTrackTests
        - StudyTrackUITests
