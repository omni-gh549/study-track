name: StudyTrack
options:
  bundleIdPrefix: com.studytrack
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.7.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  StudyTrack:
    type: application
    platform: iOS
    sources:
      - StudyTrack
      - Shared
    dependencies:
      - target: StudyTrackWidgets
    info:
      path: Config/StudyTrack-Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: StudyTrack
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        LSSupportsOpeningDocumentsInPlace: true
        NSSupportsLiveActivities: true
        UIFileSharingEnabled: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studytrack.app
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  StudyTrackWidgets:
    type: app-extension
    platform: iOS
    sources:
      - StudyTrackWidgets
      - Shared
    info:
      path: Config/StudyTrackWidgets-Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: StudyTrack Timer
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studytrack.app.widgets
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
  StudyTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StudyTrackTests
    dependencies:
      - target: StudyTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.studytrack.app.tests
  StudyTrackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - StudyTrackUITests
    dependencies:
      - target: StudyTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.studytrack.app.uitests
schemes:
  StudyTrack:
    build:
      targets:
        StudyTrack: all
    test:
      targets:
        - StudyTrackTests
        - StudyTrackUITests
